[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnova"
version = "0.6.0.0"
description = "REDIRECT PACKAGE - Use 'agentkthx' instead. This package has been renamed."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "VTSTech", email = "veritas@vts-tech.org"}
]
dependencies = [
    "agentkthx>=0.6.0",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/VTSTech/AgentKthx"
Repository = "https://github.com/VTSTech/AgentKthx"

[project.scripts]
agentnova = "agentnova:main"

[tool.setuptools.packages.find]
include = ["agentnova"]
